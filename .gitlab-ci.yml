# La liste des shims (docs/shims.md) est GENEREE depuis les sources. Une liste
# ecrite a la main est fausse au deuxieme commit, et une liste fausse est pire
# que pas de liste. Ce job est ce qui empeche la page de pourrir : il regenere
# et refuse le commit si le resultat differe de ce qui est versionne.
doc-shims:
  stage: test
  image: python:3.12-slim
  script:
    - python3 tools/gen_shim_list.py --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir mkdocs-material
    # Le site ne se publie pas avec une liste de shims perimee.
    - python3 tools/gen_shim_list.py --check
    - mkdocs build -d public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
