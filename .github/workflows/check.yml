name: Check

# The shim list (docs/shims.md) is GENERATED from the sources. A hand-written
# list is wrong by the second commit, and a wrong list is worse than no list.
# This job is what keeps the page from rotting: it regenerates it and fails
# if the result differs from what is committed.

on:
  push:
  pull_request:

jobs:
  doc-shims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/gen_shim_list.py --check
